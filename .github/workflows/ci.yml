name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Python tests
        run: python3 -m unittest -v

      - name: Build Apple Silicon app
        run: |
          chmod +x build_app.sh
          ./build_app.sh
          test "$(lipo -archs 'dist/Codex Recap.app/Contents/MacOS/Codex Recap')" = "arm64"
